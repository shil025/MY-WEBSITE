<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Styled Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">The Styled Store</div>
    <nav>
      <a href="#">Men</a>
      <a href="#">Women</a>
      <a href="#">Accessories</a>
      <a href="#">Sale</a>
    </nav>
    <div class="cart">🛒</div>
  </header>

  <section class="hero">
    <h1>Style That Speaks</h1>
    <p>Shop the latest trends now!</p>
    <button>Shop Now</button>
  </section>

  <section class="products">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="https://via.placeholder.com/200x250" alt="Product 1">
        <h3>Cool T-Shirt</h3>
        <p>₹599</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200x250" alt="Product 2">
        <h3>Classic Hoodie</h3>
        <p>₹999</p>
        <button>Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200x250" alt="Product 3">
        <h3>Jogger Pants</h3>
        <p>₹799</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 The Styled Store. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
